<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Purifier Main Body -->
  <rect x="75" y="40" width="350" height="480" rx="36" fill="url(#bodyGrad)" stroke="#334155" stroke-width="4"/>
  
  <!-- Sleek Top Curve Accent -->
  <path d="M100 70 Q 250 45 400 70" stroke="rgba(255,255,255,0.15)" stroke-width="3" fill="none"/>

  <!-- Display Panel -->
  <rect x="130" y="100" width="240" height="150" rx="20" fill="#020617" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Digital Indicator Rings -->
  <circle cx="250" cy="160" r="38" stroke="url(#cyanGlow)" stroke-width="4" fill="none" stroke-dasharray="180 30"/>
  <circle cx="250" cy="160" r="28" fill="#0369a1" fill-opacity="0.2"/>
  <path d="M250 145 C250 145 238 162 238 168 C238 174.6 243.4 180 250 180 C256.6 180 262 174.6 262 168 C262 162 250 145 250 145 Z" fill="#38bdf8"/>
  
  <text x="250" y="225" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2">RO + UV + MINERALS</text>

  <!-- Wave Accent Art on Purifier -->
  <path d="M100 320 C 180 280, 320 360, 400 310" stroke="rgba(56, 189, 248, 0.25)" stroke-width="3" fill="none"/>
  <path d="M100 340 C 200 300, 300 380, 400 330" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" fill="none"/>

  <!-- Chrome Dispenser Tap Area -->
  <rect x="225" y="380" width="50" height="35" rx="8" fill="#64748b"/>
  <rect x="240" y="415" width="20" height="15" rx="4" fill="#94a3b8"/>
  
  <!-- Glass under tap -->
  <path d="M220 460 L230 540 Q250 550 270 540 L280 460 Z" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <!-- Water in glass -->
  <path d="M223 480 L231 536 Q250 545 269 536 L277 480 Q250 490 223 480 Z" fill="url(#glassGrad)"/>
  
  <!-- Water Stream from Tap -->
  <line x1="250" y1="430" x2="250" y2="485" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  
  <!-- LED status indicator lights -->
  <circle cx="180" cy="275" r="4" fill="#22c55e" filter="url(#glow)"/>
  <text x="190" y="278" fill="#64748b" font-family="system-ui" font-size="10">Purity OK</text>
  
  <circle cx="300" cy="275" r="4" fill="#06b6d4" filter="url(#glow)"/>
  <text x="310" y="278" fill="#64748b" font-family="system-ui" font-size="10">Active</text>
</svg>
