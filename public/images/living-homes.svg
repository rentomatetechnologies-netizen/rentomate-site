<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#skyGrad)"/>
  <!-- Garden Greenery -->
  <rect y="300" width="600" height="100" fill="#16a34a"/>
  <!-- Modern Villa House -->
  <rect x="150" y="160" width="300" height="150" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <polygon points="120,165 300,70 480,165" fill="url(#roofGrad)"/>
  <!-- Windows -->
  <rect x="180" y="190" width="60" height="50" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <rect x="360" y="190" width="60" height="50" rx="4" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <rect x="270" y="220" width="50" height="90" rx="4" fill="#78350f"/>
  <circle cx="310" cy="265" r="3" fill="#fef08a"/>
</svg>
